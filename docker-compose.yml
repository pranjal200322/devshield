# One command (docker compose up --build) starts the API AND Redis.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379   # "redis" is the service name above
      RL_CAPACITY: "20"
      RL_REFILL_PER_SEC: "10"
      CACHE_TTL: "30"
    depends_on:
      redis:
        condition: service_healthy
